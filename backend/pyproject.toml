[project]
name = "unified-liveness"
version = "0.1.0"
requires-python = "~=3.14.0"
dependencies = [
    "aiofiles>=25.1.0",
    "cachetools>=7.2.1",
    "fastapi[standard]>=0.143.0",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch",
    "torchvision",
    "unigaze>=0.1.3",
]

# Сборка torch выбирается extra: `uv sync --extra cpu` или `uv sync --extra gpu`.
[project.optional-dependencies]
cpu = ["torch", "torchvision"]
gpu = ["torch", "torchvision"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# unigaze фиксирует timm==0.3.2 (2020), а та на Python 3.14+ сыплет
# предупреждениями про torch.jit.script; с новой timm unigaze тоже работает.
override-dependencies = ["timm>=1.0.30"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Драйвер NVIDIA не ниже 580.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
