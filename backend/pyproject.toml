[project]
name = "unified-liveness"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "aiofiles>=25.1.0",
    "cachetools>=7.2.1",
    "fastapi[standard]>=0.143.0",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch",
    "torchvision",
    "unigaze>=0.1.3",
    "webeyetrack>=0.0.1",
]

# для GPU-сборок убрать
#
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
#
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
