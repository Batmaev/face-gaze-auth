services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    tmpfs:
      - /app/__pycache__
      - /app/routers/__pycache__
      - /app/liveness/__pycache__
      - /app/stimulus/__pycache__
    restart: unless-stopped

volumes:
  backend_venv:
