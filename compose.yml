services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HF_HOME: /cache/huggingface
      ROOT_PATH: /api
      # uvicorn читает это, если fastapi run запущен без --workers
      WEB_CONCURRENCY: "2"
    volumes:
      - ./backend:/app
      - huggingface_cache:/cache/huggingface
    tmpfs:
      - /app/__pycache__
      - /app/routers/__pycache__
      - /app/liveness/__pycache__
      - /app/stimulus/__pycache__
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

volumes:
  huggingface_cache:
