services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    tmpfs:
      - /app/__pycache__
      - /app/routers/__pycache__
      - /app/liveness/__pycache__
      - /app/stimulus/__pycache__
    restart: unless-stopped

    ports: # or add https in front
      - 8000:8000
