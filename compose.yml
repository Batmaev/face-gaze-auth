services:
  backend:
    build:
      context: ./backend
    environment:
      # .pyc не в bind mount, чтобы не мусорить в репозитории на хосте
      PYTHONPYCACHEPREFIX: /tmp/pycache
      # uvicorn читает это, если fastapi run запущен без --workers.
      # На 4 vCPU третий процесс уже делит ядра с другими на декодировании видео
      WEB_CONCURRENCY: "2"
      # Пусто — cuda, если она есть, иначе cpu
      TORCH_DEVICE: ${TORCH_DEVICE:-}
      # 0 — fp32. На CUDA по умолчанию fp16
      UNIGAZE_FP16: ${UNIGAZE_FP16:-1}
      # 0 — через сети только оставленные кадры, 1 — ещё и прореженные
      UNIGAZE_ALL_FRAMES: ${UNIGAZE_ALL_FRAMES:-1}
      # cpu, gpu или auto: GPU только при CUDA
      MEDIAPIPE_DEVICE: ${MEDIAPIPE_DEVICE:-auto}
    volumes:
      - ./backend:/app
      - huggingface_cache:/cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Пусто — Caddy слушает http://:80 без сертификата, см. frontend/Caddyfile
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  huggingface_cache:
  caddy_data:
  caddy_config:
